services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindbase-postgres
    environment:
      POSTGRES_USER: mindbase
      POSTGRES_PASSWORD: mindbase
      POSTGRES_DB: mindbase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindbase -d mindbase"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mindbase-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 后端/前端容器可在 W8 补充，开发阶段建议本地运行：
  # backend:
  #   build: ./backend
  #   ports:
  #     - "8000:8000"
  #   env_file: .env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
  redis_data:
